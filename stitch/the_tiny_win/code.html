<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4ade80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
            margin: 0;
            padding: 0;
        }
        .glow-effect {
            background: radial-gradient(circle at center, rgba(74, 222, 128, 0.15) 0%, rgba(18, 32, 23, 1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center glow-effect overflow-x-hidden p-6">
<!-- Subtle Particle Decoration -->
<div class="absolute inset-0 pointer-events-none opacity-30">
<div class="absolute top-1/4 left-1/4 w-2 h-2 rounded-full bg-primary blur-sm"></div>
<div class="absolute top-1/3 right-1/4 w-3 h-3 rounded-full bg-primary/40 blur-md"></div>
<div class="absolute bottom-1/4 right-1/3 w-2 h-2 rounded-full bg-primary/60 blur-sm"></div>
<div class="absolute bottom-1/3 left-1/2 w-4 h-4 rounded-full bg-primary/20 blur-lg"></div>
</div>
<!-- Success Icon -->
<div class="mb-8 flex items-center justify-center">
<div class="w-20 h-20 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary text-5xl">auto_awesome</span>
</div>
</div>
<!-- Headline Component (Modified for Triumph) -->
<div class="max-w-md w-full text-center space-y-8 relative z-10">
<h1 class="text-slate-100 tracking-tight text-4xl sm:text-5xl font-bold leading-tight px-4">
                Ты это сделал.<br/>
<span class="text-primary">Горжусь тобой.</span>
</h1>
<p class="text-slate-400 text-lg font-light max-w-[280px] mx-auto">
                Маленькая победа ведет к большим свершениям.
            </p>
<div class="flex px-4 py-3 justify-center pt-8">
<button class="flex min-w-[240px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-8 bg-primary text-background-dark text-lg font-bold leading-normal tracking-wide transition-all active:scale-95 shadow-[0_0_40px_rgba(74,222,128,0.3)]">
<span class="truncate">Отдохнуть 5 минут</span>
</button>
</div>
</div>
<!-- Footer Accent -->
<div class="absolute bottom-10 flex flex-col items-center gap-2 opacity-60">
<span class="material-symbols-outlined text-primary/80">workspace_premium</span>
<span class="text-xs uppercase tracking-[0.2em] text-primary/60 font-medium">Миссия завершена</span>
</div>
</div>
</body></html>
